# targetSdk is 36 and Robolectric has no runtime for it yet, so the Compose
# tests run on the newest SDK it does ship. minSdk is 26, so this stays inside
# the range the app supports.
sdk=35

# Robolectric's default device is 320x470dp, which is smaller than any phone
# this app runs on and pushes half of every screen below the fold. A Pixel-sized
# window means an assertion about something being visible is about the layout
# rather than about the emulator being tiny.
qualifiers=w411dp-h891dp
