worker_processes auto;
error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    log_format main '$remote_addr - $request_method $host$request_uri '
                    '$status $body_bytes_sent $request_time $server_protocol';
    access_log /dev/stdout main;

    upstream pocketexit_api {
        server backend:8080;
        keepalive 64;
    }

    server {
        listen 80;
        listen [::]:80;
        return 308 https://$host$request_uri;
    }

    server {
        # Internal HTTP origin for SparkTunnel; never published on the host.
        listen 8081;
        listen [::]:8081;
        listen 443 ssl;
        listen [::]:443 ssl;
        listen 443 quic reuseport;
        listen [::]:443 quic reuseport;
        http2 on;
        http3 on;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:20m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_early_data off;

        quic_retry on;
        quic_active_connection_id_limit 4;

        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;

        root /usr/share/nginx/html;
        index index.html;

        location = /api/v1/health {
            add_header Cache-Control "no-store" always;
            proxy_pass http://pocketexit_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        location ^~ /api/ {
            add_header Cache-Control "no-store" always;
            proxy_pass http://pocketexit_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        # Agent traffic enters as HTTP/3/QUIC and is streamed to the Go service.
        # Buffering is disabled in both directions so each circuit remains low latency.
        location ^~ /agent/ {
            add_header Cache-Control "no-store" always;
            proxy_pass http://pocketexit_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            client_body_timeout 1h;
            client_max_body_size 0;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

stream {
    resolver 127.0.0.11 ipv6=off valid=30s;

    upstream pocketexit_socks {
        server backend:1080;
    }

    server {
        listen 1080;
        listen [::]:1080;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_pass pocketexit_socks;
    }

    map $server_port $udp_upstream {
        12000 backend:12000;
        12001 backend:12001;
        12002 backend:12002;
        12003 backend:12003;
        12004 backend:12004;
        12005 backend:12005;
        12006 backend:12006;
        12007 backend:12007;
        12008 backend:12008;
        12009 backend:12009;
        12010 backend:12010;
        12011 backend:12011;
        12012 backend:12012;
        12013 backend:12013;
        12014 backend:12014;
        12015 backend:12015;
        12016 backend:12016;
        12017 backend:12017;
        12018 backend:12018;
        12019 backend:12019;
        12020 backend:12020;
        12021 backend:12021;
        12022 backend:12022;
        12023 backend:12023;
        12024 backend:12024;
        12025 backend:12025;
        12026 backend:12026;
        12027 backend:12027;
        12028 backend:12028;
        12029 backend:12029;
        12030 backend:12030;
        12031 backend:12031;
        default backend:12000;
    }

    # Dedicated UDP relay ports are allocated only after authenticated SOCKS5
    # UDP ASSOCIATE. A dedicated port prevents the relay from becoming open.
    server {
        listen 12000 udp reuseport;
        listen 12001 udp reuseport;
        listen 12002 udp reuseport;
        listen 12003 udp reuseport;
        listen 12004 udp reuseport;
        listen 12005 udp reuseport;
        listen 12006 udp reuseport;
        listen 12007 udp reuseport;
        listen 12008 udp reuseport;
        listen 12009 udp reuseport;
        listen 12010 udp reuseport;
        listen 12011 udp reuseport;
        listen 12012 udp reuseport;
        listen 12013 udp reuseport;
        listen 12014 udp reuseport;
        listen 12015 udp reuseport;
        listen 12016 udp reuseport;
        listen 12017 udp reuseport;
        listen 12018 udp reuseport;
        listen 12019 udp reuseport;
        listen 12020 udp reuseport;
        listen 12021 udp reuseport;
        listen 12022 udp reuseport;
        listen 12023 udp reuseport;
        listen 12024 udp reuseport;
        listen 12025 udp reuseport;
        listen 12026 udp reuseport;
        listen 12027 udp reuseport;
        listen 12028 udp reuseport;
        listen 12029 udp reuseport;
        listen 12030 udp reuseport;
        listen 12031 udp reuseport;
        proxy_connect_timeout 5s;
        proxy_timeout 10m;
        proxy_pass $udp_upstream;
    }
}
